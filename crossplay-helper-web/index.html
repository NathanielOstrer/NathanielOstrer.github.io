<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>Crossplay Helper</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <h1>Crossplay Helper</h1>

  <!-- Screenshot upload -->
  <div class="upload-area" id="uploadArea">
    <div>Drop screenshot here, click to browse, or paste (Ctrl+V / ⌘V)</div>
    <div class="upload-status" id="uploadStatus"></div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <!-- Board -->
  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <!-- Mobile keyboard (hidden on desktop via CSS) -->
  <div class="mobile-keyboard" id="mobileKeyboard"></div>

  <!-- Controls -->
  <div class="controls">
    <label for="rack">Rack:</label>
    <input type="text" id="rack" maxlength="7" placeholder="LETTERS" autocomplete="off" autocapitalize="characters">
    <button id="btnSolve">Solve</button>
    <button class="secondary" id="btnClear">Clear Board</button>
  </div>

  <!-- Word checker -->
  <div class="controls" style="margin-bottom:6px">
    <input type="text" id="checkWordInput" maxlength="20" placeholder="Check word..."
           style="width:160px;text-transform:uppercase" autocapitalize="characters">
    <button class="secondary" id="btnCheckWord">Check</button>
  </div>

  <!-- Status -->
  <div class="status" id="status">Loading dictionary...</div>

  <!-- Results -->
  <div class="results" id="results"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
